name: Stride AI CI/CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  test-and-train:
    name: Entrenamiento ML y pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Entrenar modelos ML y evaluar métricas
        run: python -m app.ml.train

      - name: Ejecutar pruebas unitarias y de API
        run: python -m pytest -v

      - name: Subir artefactos ML
        uses: actions/upload-artifact@v4
        with:
          name: ml-artifacts
          path: artifacts/

  codeql:
    name: Análisis de seguridad (CodeQL)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python

      - name: Ejecutar análisis de seguridad CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"

  docker-build:
    name: Construcción y publicación de imagen Docker
    needs: [test-and-train, codeql]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/vargas-jc/software-estimation-ai:latest
            ghcr.io/vargas-jc/software-estimation-ai:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Despliegue en VPS por SSH
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar contenedor en VPS mediante SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker network create stride-net || true
            docker pull ghcr.io/vargas-jc/software-estimation-ai:latest
            docker stop stride-ai || true
            docker rm stride-ai || true
            docker run -d \
              --name stride-ai \
              --restart unless-stopped \
              --network stride-net \
              -p 127.0.0.1:8000:8000 \
              -e APP_ENV=prod \
              -e HOST=0.0.0.0 \
              -e PORT=8000 \
              ghcr.io/vargas-jc/software-estimation-ai:latest
            docker image prune -f
